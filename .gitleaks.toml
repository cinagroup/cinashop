condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/payment-readiness\.test\.ts$''']
regexes = ['''WECHAT_MCH_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nprivate\\n-----END PRIVATE KEY-----",''']

[[allowlists]]
description = "Exact local-only placeholder PEM used by the assisted-purchase provider fixture"

title = "CinaShop repository secret scanning"
minVersion = "8.29.0"

[extend]
useDefault = true

[[allowlists]]
description = "Fixed non-secret WebSocket protocol fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/kefu-realtime-migration\.test\.ts$''']
regexes = ['''"X-Chat-Token-Key": "0123456789abcdef0123456789abcdef"''']

[[allowlists]]
description = "PEM header removal code does not contain private-key material"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/src/utils/wechat-crypto\.ts$''']
regexes = ['''\.replace\(/-----BEGIN (RSA )?PRIVATE KEY-----/g, ""\)''']

[[allowlists]]
description = "Historical non-secret WeChat private-key readiness fixture"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/payment-readiness\.test\.ts$''']
regexes = ['''WECHAT_MCH_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nprivate\\n-----END PRIVATE KEY-----",''']

[[allowlists]]
description = "Fixed non-secret UUID-v4 idempotency test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/admin-mobile-user-migration\.test\.ts$''']
regexes = ['''idempotencyKey: "6ba7b810-9dad-41d1-80b4-00c04fd430c8",''']

[[allowlists]]
description = "Historical non-secret payment callback replay UUID test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/payment-callback-event\.test\.ts$''']
regexes = ['''const replayKey = "018f47a2-763b-4b73-8d6a-615f80b79595";''']

[[allowlists]]
description = "Historical non-secret Supplier R2 object-prefix call"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/integration/SupplierAttachmentAuditWorker\.ts$''']
regexes = ['''const supplierObjects = await r2Inventory\(env\.ASSETS_BUCKET, databaseKeys, "attachments/supplier/"\);''']

[[allowlists]]
description = "Historical non-secret Supplier R2 object-prefix assertion"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/attachment-storage-migration\.test\.ts$''']
regexes = ['''expect\(audit\)\.toContain\('env\.ASSETS_BUCKET, databaseKeys, "attachments/supplier/"'\);''']

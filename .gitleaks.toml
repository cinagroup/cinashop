condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/audit/assisted-purchase-runtime-20260923\.json$''']
regexes = [
  '''^\s*"src/middleware/admin-auth\.ts": "b907a4f85ba58eca05c9f9272947dbefa577911d98eeb24aa4de64c11b05bfaa",$''',

[extend]
useDefault = true

[[allowlists]]
description = "Fixed non-secret Out registration replay UUID fixture; not an authentication key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^workers-ts/test/registration-level-activation\.test\.ts$''']
regexes = ['''^71efb2f8-07ce-4a18-9035-c204af955f47$''']

[[allowlists]]
description = "Fixed non-secret WebSocket protocol fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/kefu-realtime-migration\.test\.ts$''']
regexes = ['''"X-Chat-Token-Key": "0123456789abcdef0123456789abcdef"''']

[[allowlists]]
description = "PEM header removal code does not contain private-key material"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/src/utils/wechat-crypto\.ts$''']
regexes = ['''\.replace\(/-----BEGIN (RSA )?PRIVATE KEY-----/g, ""\)''']

[[allowlists]]
description = "Historical non-secret WeChat private-key readiness fixture"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/payment-readiness\.test\.ts$''']
regexes = ['''WECHAT_MCH_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nprivate\\n-----END PRIVATE KEY-----",''']

[[allowlists]]
description = "Exact local-only placeholder PEM used by the assisted-purchase provider fixture"
targetRules = ["private-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^workers-ts/test/assisted-purchase-runtime-cases\.ts$''']
regexes = ['''^-----BEGIN PRIVATE KEY-----\\nlocal\\n-----END PRIVATE KEY-----',\s*WECHAT_API_V3_KEY:'x'\.repeat\(32\),WECHAT_PLATFORM_PUBLIC_KEY:'-----BEGIN PUBLIC KEY-----$''']

[[allowlists]]
description = "Fixed non-secret UUID-v4 idempotency test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^workers-ts/test/admin-mobile-user-migration\.test\.ts$''']
regexes = ['''idempotencyKey: "6ba7b810-9dad-41d1-80b4-00c04fd430c8",''']

[[allowlists]]
description = "Historical non-secret payment callback replay UUID test fixture"

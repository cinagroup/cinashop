#:schema node_modules/wrangler/config-schema.json
name = "cinashop-api"
main = "src/index.ts"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]

# ─── 观察性 ───────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# Enterprise WeChat requires credentials in provider query strings. Keep fetch
# tracing off until deployment can set and verify query-string redaction.
[observability.traces]
enabled = false

# ─── Hyperdrive (连接外部 PostgreSQL) ─────────────────────
# 新: 腾讯云 PG (Workers VPC → Tunnel → 私有 PG, 2026-08-08 切换)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9748c294e21c49a99579c9cef70102e0"  # cinashop-pg (VPC Service 019fe223 → tunnel cinaseek_pg → PG:5432)
localConnectionString = "postgresql://crmeb:crmeb@localhost:5432/crmeb"

# ─── Upstash Redis (REST API) ─────────────────────────────
# 创建命令: wrangler kv namespace create CONFIG_KV
# 把返回的 id 填入下面 (本地 dev 无所谓, 部署前必须替换)
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "f79a153ac6ee408891f6118c06d4f9a8"

# Private object storage. Objects are served only through signed Worker URLs;
# create this bucket before the first deployment that enables attachment upload.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "cinashop-assets"

# Private R2 objects are resized only through a signed, fixed-variant URL.
[images]
binding = "IMAGES"

# Images binding output is cached under an internal key containing source ETag
# and bounded transform parameters; client responses remain private/no-store.
[cache]
enabled = true

# Upstash Redis 通过 secret 设置 (UPSTASH_REDIS_URL / UPSTASH_REDIS_TOKEN)
[vars]
NODE_ENV = "production"
INTERNAL_API_URL = "https://cinashop-api.cinagroup.workers.dev"
ORDER_DLQ_NAME = "cinashop-order-dlq"
OUT_API_LOGIN_LIMIT_PER_MINUTE = "10"
OUT_API_REFRESH_LIMIT_PER_MINUTE = "30"
OUT_API_READ_LIMIT_PER_MINUTE = "120"
OUT_API_WRITE_LIMIT_PER_MINUTE = "30"
ALLOWED_ORIGINS = "https://cinashop-pc.pages.dev,https://cinashop-h5.pages.dev"
PC_AUTH_ALLOWED_ORIGINS = "https://cinashop-pc.pages.dev"
# KEFU_AUTH_ALLOWED_ORIGINS intentionally omitted until the formal Kefu origin is approved.
# WORK_WECHAT_ALLOWED_ORIGINS and all WECHAT_WORK_* credentials intentionally remain
# absent until the formal Enterprise WeChat H5 origin, callback and credentials are approved.

# ─── Queues ───────────────────────────────────────────────
[[queues.producers]]
binding = "ORDER_QUEUE"
queue = "cinashop-order"

[[queues.consumers]]
queue = "cinashop-order"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "cinashop-order-dlq"

# Dead letters become persistent PostgreSQL alert records before acknowledgement.
# A second queue preserves messages when PostgreSQL archival itself repeatedly fails.
[[queues.consumers]]
queue = "cinashop-order-dlq"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 10
dead_letter_queue = "cinashop-order-dlq-unarchived"

# ─── Durable Objects ──────────────────────────────────────
[[durable_objects.bindings]]
name = "TOKEN_BUCKET"
class_name = "TokenBucketDO"

[[durable_objects.bindings]]
name = "ORDER_LOCK"
class_name = "OrderLockDO"

[[durable_objects.bindings]]
name = "SEQUENCE"
class_name = "SequenceDO"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenBucketDO", "OrderLockDO", "SequenceDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatRoomDO"]

# ─── 定时任务 ─────────────────────────────────────────────
[triggers]
crons = ["*/5 * * * *"]  # Queue 驱动的 outbox/未支付取消/拼团超时退款/履约/次卡提醒/直播/退款对账分页工作流

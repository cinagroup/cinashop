<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>分销等级实际验收</title><style>body{margin:8px;font:14px sans-serif;background:#f5f6f8}h1{font-size:18px}button{margin:3px;padding:6px}iframe{display:block;width:375px;height:1100px;background:#fff;border:1px solid #ddd}pre{white-space:pre-wrap;max-height:100px;overflow:auto}#instruction{padding:8px;background:#fff5dc}</style></head><body>
<h1>分销等级 · 实际 H5 / Worker / JWT / PG16</h1><p>业务页控件承担读取、分页、重试和导航；下面仅提供显式本地 QA 会话、有限夹具与实际响应传输控制。</p>
<div id="instruction"></div><div><button id="finance">当前阶段会话 · 新文档财务入口</button><button id="level">当前阶段会话 · 新文档分销等级</button><button id="fixture">应用当前阶段有限夹具</button><button id="lost">下次推荐 JSON 截首字节</button><button id="corrupt">下次平台 PNG 截首字节</button><button id="hold">暂存下次实际等级响应</button><button id="release">释放旧文档响应</button><button data-width="375">手机375</button><button data-width="1000">桌面1000</button></div>
<div id="phases"></div><pre id="result">等待装载</pre><iframe title="实际分销等级"></iframe>
<script>
const control=__CONTROL__,runId=__RUN_ID__,plans=__PLANS__,owners=__OWNERS__,result=document.querySelector('#result');let frame=document.querySelector('iframe'),lastAck=null,index=0;
const show=x=>result.textContent=typeof x==='string'?x:JSON.stringify(x);
const instructions={
 'guest-finance':'财务页确认访客看得到分销等级入口。',
 'guest-direct':'点新文档分销等级，确认登录提示而且没有业务请求。',
 'owner-finance':'点当前阶段新文档财务入口，以合成 ownerA 进入。',
 'natural-upgrade':'在实际财务页点分销等级入口。等待真实升级与推荐初页。',
 'repeated-get':'在实际分销页点击重新读取，确认幂等。',
 'all-five-granted':'用真实等级选择器选PHP初级分销，显示全部五类任务已完成；推荐保持10条。',
 'next-level-selected':'用真实等级选择器选回PHP进阶分销，显示2条未完任务和1.00元；推荐保持10条。',
 'page2-lost':'先点本地 JSON 截首字节，再只滚动实际业务页到底触发第二页；等错误出现后验收，不再点加载更多。',
 'page2-retried':'在实际业务页点重试商品推荐，仍请求第二页。',
 'page3-final':'只滚动实际业务页到底触发第三页，得到最后3条；不要再次点击加载更多。',
 'terminal':'滚动到底，确认没有新请求或下一页。',
 'ordinary-detail':'点实际推荐商品23卡片（ID660323），读取普通商品详情。',
 'ordinary-returned':'通过真实页面返回分销等级，等待初页重载。',
 'activity-detail':'点实际推荐商品22卡片（ID660322），打开真实砍价详情 /pages/activity/bargainDetail?id=660401。',
 'activity-returned':'通过真实页面返回分销等级。',
 'invite-target':'点实际PHP进阶分销的邀请三位好友任务右侧去邀请，打开真实邀请页。',
 'invite-returned':'通过真实页面返回分销等级。',
 'hidden-grant':'先应用当前阶段夹具，再点新文档分销等级（ownerB）。',
 'deleted-grant':'先应用当前阶段夹具，再点实际重新读取。',
 'maximum-grant':'先应用当前阶段夹具，再点实际重新读取。',
 'zero-tasks':'先应用当前阶段夹具，再点实际重新读取，选择PHP无任务等级。',
 'missing-image':'先应用当前阶段夹具，再点新文档分销等级（ownerA）。',
 'corrupt-image':'先应用当前阶段夹具恢复对象，然后点截PNG，再点实际重新读取。',
 'media-restored':'在实际业务页点重新读取，确认动态图片解码恢复。',
 'late-held':'先点暂存，再点新文档分销等级（ownerA），等待实际加载中。',
 'new-owner':'点新文档分销等级（ownerB），保持旧ownerA响应暂存。',
 'new-owner-released':'点释放旧文档响应；确认ownerB保持不变。',
 'empty-recommendations':'应用当前阶段夹具，再点实际刷新商品推荐。',
 'restored-recommendations':'应用当前阶段夹具后，点当前阶段会话·新文档分销等级，以 ownerB 新文档读取恢复推荐；不声称空态手动推荐刷新。',
 'desktop':'将iframe设1000px，检查双列与无横向溢出。',
 'finished':'将iframe设375px，最后验收后服务自动收尾。'};
function current(){document.querySelector('#instruction').textContent='阶段 '+(index+1)+'/'+plans.length+' '+(plans[index]?.name||'完成')+'：'+(instructions[plans[index]?.name]||'');}
async function ctl(path,data){const response=await fetch(control+path,{method:'POST',...(data?{headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});if(!response.ok)throw Error(await response.text());return response.json();}
function replace(path,width=375){const next=document.createElement('iframe');next.title='实际分销等级';next.style.width=width+'px';next.src='/__h5?qa_document='+crypto.randomUUID()+'#'+path;frame.replaceWith(next);frame=next;}
async function session(path){const plan=plans[index];if(!plan)throw Error('验收已完成');const d=await ctl('/session?owner='+plan.owner);for(const key of['uni_token','uni_uid','admin_token','admin_session'])localStorage.removeItem(key);if(d.uid){localStorage.setItem('uni_token',JSON.stringify({type:'string',data:d.token}));localStorage.setItem('uni_uid',JSON.stringify({type:'number',data:d.uid}));}replace(path,plan.width);show('新文档已装载，请用真实业务控件并等待请求完成');}
document.querySelector('#finance').onclick=()=>session('/pages/user/finance').catch(show);
document.querySelector('#level').onclick=()=>session('/pages/users/user_distribution_level/index').catch(show);
document.querySelector('#fixture').onclick=async()=>{try{if(!plans[index]?.scenario)throw Error('本阶段没有有限夹具');show(await ctl('/fixture?name='+plans[index].scenario));}catch(e){show(String(e));}};
for(const id of['lost','corrupt','hold','release'])document.querySelector('#'+id).onclick=async()=>{try{show(await ctl('/'+id));}catch(e){show(String(e));}};
for(const button of document.querySelectorAll('[data-width]'))button.onclick=()=>frame.style.width=button.dataset.width+'px';
for(const plan of plans){const button=document.createElement('button');button.textContent='验收 '+plan.name;button.dataset.stage=plan.name;document.querySelector('#phases').append(button);button.onclick=async()=>{button.disabled=true;try{
 if(plan.name!==plans[index]?.name)throw Error('必须按阶段顺序验收');
 const d=frame.contentDocument,w=frame.contentWindow,visible=n=>{if(!n||n.getBoundingClientRect().width<=0||n.getBoundingClientRect().height<=0)return false;for(let p=n;p&&p.nodeType===1;p=p.parentElement){const s=w.getComputedStyle(p);if(s.display==='none'||s.visibility==='hidden')return false;}return true;},page=[...d.querySelectorAll('uni-page')].filter(visible).at(-1)||d.body,root=page.querySelector('.distribution-page'),rec=root?.querySelector('.recommendations'),qa=w.__distributionQa||{errors:[{message:'Missing early observer'}],resourceErrors:[]};
 const grid=rec?.querySelector('.recommendation-grid'),commission=root?.querySelector('.level-grow-wrap'),rows=[...(root?.querySelectorAll('.distribution-task,.task-row')||[])],images=[...page.querySelectorAll('img')].filter(visible);
 const data={run_id:runId,previous_ack:lastAck,captured_at_ms:Date.now(),href:w.location.href,width:frame.clientWidth,viewportWidth:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,text:page.innerText,
 owner:Number(root?.getAttribute('data-distribution-owner')||0),selected_level:Number(root?.getAttribute('data-selected-level')||0),nickname:root?.querySelector('.nickname')?.textContent||'',badge:root?.querySelector('.user-badge')?.textContent||'',
 tasks:rows.map(n=>({id:Number(n.getAttribute('data-task-id')||n.getAttribute('data-distribution-task-id')||0),text:n.textContent,progress:n.querySelector('.progress-inner')?.getAttribute('style')||'',button:n.querySelector('button')?.textContent||''})),task_text:rows.map(n=>n.textContent).join(' '),
 product_ids:[...(rec?.querySelectorAll('[data-level-product-id]')||[])].map(n=>Number(n.getAttribute('data-level-product-id'))),recommendation_page:Number(rec?.getAttribute('data-level-recommendation-page')||0),
 recommendation_error:rec?.querySelector('[role="alert"]')?.textContent||'',loading:[...page.querySelectorAll('[role="status"]')].some(visible),failed_placeholders:root?.querySelectorAll('.badge-placeholder,.recommendation-placeholder').length||0,
 grid_columns:grid?w.getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length:0,commission_columns:commission?w.getComputedStyle(commission).gridTemplateColumns.split(' ').filter(Boolean).length:0,
 styles:root?{avatarWidth:root.querySelector('.avatar')?.getBoundingClientRect().width,badgeWidth:root.querySelector('.level-badge')?.getBoundingClientRect().width,badgeHeight:root.querySelector('.level-badge')?.getBoundingClientRect().height,background:root.querySelector('.skill-section')?w.getComputedStyle(root.querySelector('.skill-section')).backgroundImage:''}:null,
 images:images.map(n=>({src:n.getAttribute('src')||'',currentSrc:n.currentSrc,complete:n.complete,naturalWidth:n.naturalWidth,naturalHeight:n.naturalHeight,width:n.getBoundingClientRect().width,height:n.getBoundingClientRect().height})),errors:qa.errors,resource_errors:qa.resourceErrors};
 const ack=await ctl('/phase/'+plan.name,data);if(!ack.accepted){show(ack);return;}if(ack.run_id!==runId||ack.name!==plan.name)throw Error('Unbound ACK');lastAck=ack.ack;index++;current();show(ack);
 }catch(e){show(String(e));}finally{button.disabled=false;}};}
current();session('/pages/user/finance').catch(show);
</script></body></html>

<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>后台提现目录实际验收</title><style>body{margin:8px;font:14px sans-serif;background:#f6f7f8}h1{font-size:18px}button{margin:3px;padding:6px}iframe{display:block;width:1440px;height:1100px;background:#fff;border:1px solid #ddd}pre{white-space:pre-wrap;max-height:100px;overflow:auto}</style></head><body>
<h1>后台提现目录 · 实际 Admin / Worker / PG16</h1><p>仅本机合成账户；新文档装载会话。业务仅GET/HEAD，两次显式QA角色规则变更。媒体故障保留实际Worker完整响应，只截首字节。无资金写、外网、队列消费、假时钟。</p>

<div id="phases"></div><pre id="result"></pre><iframe title="实际后台提现管理"></iframe>

 const data={run_id:runId,previous_ack:lastAck,captured_at_ms:Date.now(),href:w.location.href,width:frame.clientWidth,viewportWidth:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,text:d.body.innerText,rows,page:Number(pager?.querySelector('.el-pager .is-active')?.textContent||1),cards:[...(directory?.querySelectorAll('.stat-card strong')||[])].map(n=>n.textContent),total_text:directory?.querySelector('.pagination>span')?.textContent||'',inputs:[...(directory?.querySelectorAll('input')||[])].map(n=>({value:n.value,placeholder:n.placeholder,aria_label:n.getAttribute('aria-label')||''})),directory_present:!!directory,review_active:!!review,review_tab:[...d.querySelectorAll('[role="tab"]')].some(n=>visible(n)&&n.textContent.trim()==='提现审核'),review_buttons:[...(review?.querySelectorAll('.el-table__body button')||[])].filter(n=>visible(n)&&['通过','拒绝'].includes(n.textContent.trim())).length,loading:[...d.querySelectorAll('.el-loading-mask')].some(visible),media:dialog?{text:dialog.innerText,src:img?.getAttribute('src')||'',naturalWidth:img?.naturalWidth||0,naturalHeight:img?.naturalHeight||0,complete:img?.complete||false}:null,errors:qa.errors,resource_errors:qa.resourceErrors};

 }catch(e){show(String(e))}finally{button.disabled=false}}}
</script></body></html>

<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>分销中心实际验收</title><style>body{margin:8px;font:14px sans-serif;background:#f5f6f8}h1{font-size:18px}button{margin:3px;padding:6px}iframe{display:block;width:375px;height:1200px;background:#fff;border:1px solid #ddd}pre{white-space:pre-wrap;max-height:80px;overflow:auto}#instruction{padding:8px;background:#fff5dc}</style></head><body><h1>分销中心 · 实际H5 / Worker / JWT / PG16</h1><p>仅本地合成会话、文档和传输控制。业务控件承担实际导航、绑定、错误重试。</p><div id="instruction"></div>
<div><button id="finance">当前阶段会话 · 新文档财务</button><button id="lost">截断下次真实概览JSON</button><button id="hold">暂存下次真实概览</button><button id="release">释放旧文档概览</button><button id="corrupt">截断下次原菜单PNG</button><button id="mobile">手机375</button><button id="desktop">桌面1000</button></div>
<div id="phases"></div><pre id="result">等待装载</pre><iframe title="实际分销中心"></iframe>
<script>
const control=__CONTROL__,runId=__RUN_ID__,plans=__PLANS__,result=document.querySelector('#result');let frame=document.querySelector('iframe'),index=0,lastAck=null;
const show=x=>result.textContent=typeof x==='string'?x:JSON.stringify(x);
function current(){document.querySelector('#instruction').textContent='阶段 '+(index+1)+'/'+plans.length+' '+(plans[index]?.name||'完成');}
async function ctl(path,data){const r=await fetch(control+path,{method:'POST',...(data?{headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});if(!r.ok)throw Error(await r.text());return r.json();}
async function session(){const p=plans[index];if(!p)throw Error('Finished');const s=await ctl('/session?owner='+p.owner);for(const k of['uni_token','uni_uid','admin_token','admin_session'])localStorage.removeItem(k);if(s.uid){localStorage.setItem('uni_token',JSON.stringify({type:'string',data:s.token}));localStorage.setItem('uni_uid',JSON.stringify({type:'number',data:s.uid}));}const next=document.createElement('iframe');next.title='实际分销中心';next.style.width=p.width+'px';next.src='/__h5?qa_document='+crypto.randomUUID()+'#/pages/user/finance';frame.replaceWith(next);frame=next;show('新文档财务已装载');}
document.querySelector('#finance').onclick=()=>session().catch(e=>show(String(e)));
for(const id of['lost','hold','release','corrupt'])document.querySelector('#'+id).onclick=()=>ctl('/'+id).then(show,e=>show(String(e)));
document.querySelector('#mobile').onclick=()=>frame.style.width='375px';document.querySelector('#desktop').onclick=()=>frame.style.width='1000px';
for(const p of plans){const b=document.createElement('button');b.textContent='验收 '+p.name;b.dataset.stage=p.name;document.querySelector('#phases').append(b);b.onclick=async()=>{b.disabled=true;try{if(plans[index]?.name!==p.name)throw Error('必须顺序验收');const d=frame.contentDocument,w=frame.contentWindow,visible=n=>{if(!n||n.getBoundingClientRect().width<=0||n.getBoundingClientRect().height<=0)return false;for(let q=n;q&&q.nodeType===1;q=q.parentElement){const s=w.getComputedStyle(q);if(s.display==='none'||s.visibility==='hidden')return false;}return true;},page=[...d.querySelectorAll('uni-page')].filter(visible).at(-1)||d.body,root=page.querySelector('.finance-page'),grid=root?.querySelector('.statistics'),columns=root?.querySelector('.balance-sub'),sub=root?.querySelector('.balance-sub')?.getBoundingClientRect(),withdraw=root?.querySelector('.withdraw-wrap')?.getBoundingClientRect(),qa=w.__financeQa||{errors:[{message:'Missing observer'}],resourceErrors:[]};
const data={run_id:runId,previous_ack:lastAck,captured_at_ms:Date.now(),href:w.location.href,width:frame.clientWidth,viewportWidth:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,text:page.innerText,errors:qa.errors,resource_errors:qa.resourceErrors,
menu_labels:[...(root?.querySelectorAll('.menu-item')||[])].map(n=>n.innerText),menu_columns:grid?w.getComputedStyle(grid).gridTemplateColumns.split(' ').length:0,commission_columns:columns?w.getComputedStyle(columns).gridTemplateColumns.split(' ').length:0,background:root?w.getComputedStyle(root.querySelector('.balance-card')).backgroundImage:'',amount:root?.querySelector('.balance-num')?.textContent||'',alert:root?.querySelector('[role="alert"]')?.textContent||'',failed_icons:root?.querySelectorAll('.menu-icon-placeholder').length||0,withdraw_clear:!!sub&&!!withdraw&&sub.bottom<=withdraw.top+1,withdraw_text:root?.querySelector('.withdraw-button')?.innerText||'',menu_images:[...(root?.querySelectorAll('.menu-item img')||[])].map(n=>({src:n.getAttribute('src'),complete:n.complete,naturalWidth:n.naturalWidth,naturalHeight:n.naturalHeight})),images:[...page.querySelectorAll('img')].filter(visible).map(n=>({src:n.getAttribute('src'),complete:n.complete,naturalWidth:n.naturalWidth,naturalHeight:n.naturalHeight}))};
const a=await ctl('/phase/'+p.name,data);if(!a.accepted){show(a);return;}if(a.run_id!==runId||a.name!==p.name)throw Error('UnboundACK');lastAck=a.ack;index++;current();show(a);}catch(e){show(String(e));}finally{b.disabled=false;}};}
current();session().catch(e=>show(String(e)));
</script></body></html>

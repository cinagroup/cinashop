<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>分销说明实际验收</title><style>body{margin:8px;font:14px sans-serif;background:#f6f7f8}h1{font-size:18px}button{margin:3px;padding:6px}iframe{display:block;width:375px;height:1100px;background:#fff;border:1px solid #ddd}pre{white-space:pre-wrap;max-height:110px;overflow:auto}textarea{width:700px;height:70px}</style></head><body>
<h1>分销说明 · 实际 H5 / Admin / Worker / PG16</h1><p>访客入口与公开读取；真实后台源码保存。会话、有限夹具和实际响应传输故障为显式本地 QA 控制；业务资金和权限不写入。请通过页面实际控件编辑和重读。</p>
<div><button id="finance">访客财务入口</button><button id="read">访客新文档说明页</button><button id="admin">后台说明编辑页</button><button data-fixture="missing">QA缺失图片正文</button><button data-fixture="image">QA实际PNG正文</button><button data-fixture="null">QA正文NULL</button><button data-fixture="absent">QA移除type2</button><button data-fixture="saved">QA恢复已保存正文</button><button data-fixture="original">QA原版正文</button><button id="corrupt">下一张实际PNG截首字节</button><button id="hold">暂存下次实际公开响应</button><button id="release">释放旧文档响应</button><button id="read-fault">下次公开JSON截首字节</button><button id="probes">显式HEAD及旧接口</button><button data-width="375">手机375</button><button data-width="1000">桌面1000</button></div>
<p>后台 HTML 源码候选（复制到实际“分销说明 HTML 源码”文本框，然后点页面“保存说明”）：</p><textarea readonly aria-label="待保存的验收HTML"></textarea><div id="phases"></div><pre id="result">等待装载</pre><iframe title="实际分销说明"></iframe>
<script>
const control=__CONTROL__,runId=__RUN_ID__,plans=__PLANS__,saved=__SAVED_HTML__,result=document.querySelector('#result');let frame=document.querySelector('iframe'),lastAck=null;
document.querySelector('textarea').value=saved;
const show=value=>{result.textContent=typeof value==='string'?value:JSON.stringify(value)};
async function ctl(path,data){const response=await fetch(control+path,{method:'POST',...(data?{headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});if(!response.ok)throw Error(await response.text());return response.json()}
function replace(path,width){const next=document.createElement('iframe');next.title='实际分销说明';next.style.width=width+'px';next.src=path+(path.includes('#')?'':'?qa_document='+crypto.randomUUID());frame.replaceWith(next);frame=next}
async function guest(path='/pages/user/agentExplanation'){await ctl('/session?kind=guest');for(const key of ['uni_token','uni_uid','admin_token','admin_session'])localStorage.removeItem(key);replace('/__h5#'+path,375);show('已装载访客新文档，请等待实际读取完成')}
document.querySelector('#finance').onclick=()=>guest('/pages/user/finance').catch(show);
document.querySelector('#read').onclick=()=>guest().catch(show);
document.querySelector('#admin').onclick=async()=>{try{const d=await ctl('/session?kind=admin');localStorage.setItem('admin_token',d.token);localStorage.setItem('admin_session',JSON.stringify(d.session));replace('/agent/agreement',1440);show('已装载合成后台会话；请用实际源码文本框和保存按钮')}catch(e){show(String(e))}};
for(const button of document.querySelectorAll('[data-fixture]'))button.onclick=async()=>{try{show(await ctl('/fixture?name='+button.dataset.fixture))}catch(e){show(String(e))}};
for(const id of ['corrupt','hold','release','read-fault'])document.querySelector('#'+id).onclick=async()=>{try{show(await ctl('/'+id))}catch(e){show(String(e))}};
for(const button of document.querySelectorAll('[data-width]'))button.onclick=()=>{frame.style.width=button.dataset.width+'px'};
document.querySelector('#probes').onclick=async()=>{try{const replies=[];for(const[path,method]of [['/api/agent/explanation','HEAD'],['/api/agreement/2','GET']]){const response=await fetch(path,{method,cache:'no-store',headers:{'X-Agent-Explanation-Probe':'1'}});replies.push({path,method,status:response.status,body:await response.text()})}show(replies)}catch(e){show(String(e))}};
for(const plan of plans){const button=document.createElement('button');button.textContent='验收 '+plan.name;button.dataset.stage=plan.name;document.querySelector('#phases').append(button);button.onclick=async()=>{button.disabled=true;try{
 const d=frame.contentDocument,w=frame.contentWindow,visible=n=>{if(!n||n.getBoundingClientRect().width<=0||n.getBoundingClientRect().height<=0)return false;for(let p=n;p&&p.nodeType===1;p=p.parentElement){const s=w.getComputedStyle(p);if(s.display==='none'||s.visibility==='hidden')return false}return true},page=[...d.querySelectorAll('uni-page')].filter(visible).at(-1)||d.body,root=page.querySelector('.agent-explanation'),content=root?.querySelector('.content'),style=content?w.getComputedStyle(content):null,qa=w.__agentQa||{errors:[{message:'Missing early document observer'}],resourceErrors:[]},source=d.querySelector('textarea[aria-label="分销说明 HTML 源码"]'),saveButton=[...d.querySelectorAll('button')].find(n=>n.textContent.trim()==='保存说明'),activeSwitch=d.querySelector('.agent-agreement-page [role="switch"]');
 const data={run_id:runId,previous_ack:lastAck,captured_at_ms:Date.now(),href:w.location.href,width:frame.clientWidth,viewportWidth:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,text:page.innerText,body_text:content?.innerText||'',document_id:Number(root?.getAttribute('data-agent-explanation-id')||0),loaded:root?.getAttribute('data-agent-explanation-loaded')==='true',expired:root?.getAttribute('data-agent-explanation-expired')==='true',loading:!!root?.querySelector('[role="status"]')&&!root?.querySelector('.content'),error:root?.querySelector('[role="alert"]')?.innerText||'',login_modal:[...d.querySelectorAll('uni-modal,.uni-popup')].some(n=>visible(n)&&/登录/.test(n.innerText)),padding:style?{top:style.paddingTop,right:style.paddingRight,bottom:style.paddingBottom,left:style.paddingLeft}:null,background:root?w.getComputedStyle(root).backgroundColor:'',root_font_size:w.getComputedStyle(d.documentElement).fontSize,roles:[...new Set([...(content?.querySelectorAll('[role]')||[])].map(n=>n.getAttribute('role')))],styles:[...(content?.querySelectorAll('h2,.presentation-html-h2')||[])].map(n=>{const s=w.getComputedStyle(n);return{text:n.textContent,color:s.color,fontSize:s.fontSize,lineHeight:s.lineHeight}}),images:[...page.querySelectorAll('img')].filter(visible).map(n=>({src:n.getAttribute('src')||'',currentSrc:n.currentSrc,complete:n.complete,naturalWidth:n.naturalWidth,naturalHeight:n.naturalHeight,width:n.getBoundingClientRect().width,height:n.getBoundingClientRect().height})),videos:[...page.querySelectorAll('video')].filter(visible).map(n=>({src:n.getAttribute('src')||'',currentSrc:n.currentSrc,readyState:n.readyState,videoWidth:n.videoWidth,videoHeight:n.videoHeight,currentTime:n.currentTime,paused:n.paused,error:n.error?{code:n.error.code,message:n.error.message}:null})),source_value:source?.value??null,save_disabled:saveButton?.disabled??null,admin_status:activeSwitch?activeSwitch.getAttribute('aria-checked')==='true':null,unsafe_marker:!!w.__explanationUnsafe,errors:qa.errors,resource_errors:qa.resourceErrors};
 const accepted=await ctl('/phase/'+plan.name,data);if(accepted.run_id!==runId||accepted.name!==plan.name||accepted.accepted!==true)throw Error('Unbound phase ACK');lastAck=accepted.ack;show(accepted)
 }catch(e){show(String(e))}finally{button.disabled=false}}}
guest('/pages/user/finance').catch(show);
</script></body></html>

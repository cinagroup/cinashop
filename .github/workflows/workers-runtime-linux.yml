name: Migration gates (Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers-ts/**"
      - "view/common/**"
      - "view/admin-ts/**"
      - "view/pc-ts/**"
      - "view/supplier-ts/**"
      - "view/kefu-ts/**"
      - "view/uniapp-ts/**"
      - ".gitleaks.toml"
      - ".github/workflows/workers-runtime-linux.yml"
  pull_request:
    paths:
      - "workers-ts/**"
      - "view/common/**"
      - "view/admin-ts/**"
      - "view/pc-ts/**"
      - "view/supplier-ts/**"
      - "view/kefu-ts/**"
      - "view/uniapp-ts/**"
      - ".gitleaks.toml"
      - ".github/workflows/workers-runtime-linux.yml"

permissions:
  contents: read

concurrency:
  group: workers-runtime-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-static:
    name: Worker type, unit, schema and route gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: finance_test
          POSTGRES_DB: cinashop_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_test -d cinashop_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_FINANCE_POSTGRES_URL: postgresql://finance_test:finance_test@127.0.0.1:5432/cinashop_finance_test
    defaults:
      run:
        working-directory: workers-ts
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: workers-ts/package-lock.json

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run both TypeScript configurations
        run: npm run typecheck

      - name: Run Worker unit tests
        run: npm run test:unit

      - name: Audit production observability contract
        run: npm run audit:observability

      - name: Audit legacy-to-PostgreSQL schema drift
        run: |
          npx --no-install tsx scripts/mysql-to-postgres.ts schema-audit --json |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(JSON.stringify({source:r.coverage.sourceTableCount,target:r.coverage.targetTableCount,shared:r.coverage.sharedTableCount,sourceGaps:r.coverage.sourceColumnGapTableCount,externalOnly:r.definitionDrift.externalOnlyTables.length,workerOnly:r.definitionDrift.workerOnlyTables.length,columnDrift:r.definitionDrift.columnDrift.length}));})'

      - name: Audit legacy-to-Worker route parity
        run: |
          npx --no-install tsx scripts/route-parity-audit.ts |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(JSON.stringify({authority:r.phpRoot,...r.totals}));})'

  runtime:
    name: workerd runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers-ts
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: workers-ts/package-lock.json

      - name: Verify pinned Node and npm
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run Workers runtime tests
        run: npm run test:runtime

  frontends:
    name: ${{ matrix.name }} build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Admin
            directory: admin-ts
            command: npm run build
          - name: PC
            directory: pc-ts
            command: npm run build
          - name: Supplier
            directory: supplier-ts
            command: npm run build
          - name: Kefu
            directory: kefu-ts
            command: npm test && npm run build
          - name: UniApp
            directory: uniapp-ts
            command: npm run typecheck && npm run test:toolchain && npm run build:h5 && npm run build:mp-weixin && npm run build:app && npm run test:build-artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: view/${{ matrix.directory }}/package-lock.json

      - name: Verify pinned Node and npm
        working-directory: view/${{ matrix.directory }}
        run: |
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"

      - name: Install locked dependencies
        working-directory: view/${{ matrix.directory }}
        run: npm ci

      - name: Run type, test and build contract
        working-directory: view/${{ matrix.directory }}
        run: ${{ matrix.command }}

      - name: Verify frontend dependency security regressions
        working-directory: view/${{ matrix.directory }}
        run: node --test ../common/toolchain-security.test.mjs

      - name: Audit complete Kefu and PC dependency trees
        if: matrix.directory == 'kefu-ts' || matrix.directory == 'pc-ts'
        working-directory: view/${{ matrix.directory }}
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org

      - name: Verify current ECharts tooltip paths
        if: matrix.directory == 'admin-ts' || matrix.directory == 'supplier-ts'
        working-directory: view/${{ matrix.directory }}
        run: node --test ../common/echarts-tooltip.test.mjs

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.29.0"
          GITLEAKS_LINUX_X64_SHA256: "39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c"
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan current and historical commits with pinned Gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner

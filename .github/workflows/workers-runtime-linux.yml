name: Workers runtime (Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers-ts/**"
      - ".github/workflows/workers-runtime-linux.yml"
  pull_request:
    paths:
      - "workers-ts/**"
      - ".github/workflows/workers-runtime-linux.yml"

permissions:
  contents: read

concurrency:
  group: workers-runtime-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: workerd runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers-ts
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: workers-ts/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Workers runtime tests
        run: npm run test:runtime
